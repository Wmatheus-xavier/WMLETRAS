name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ncurses (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libncurses-dev

      - name: Install ncurses (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses

      - name: Build
        run: make all

      - name: Run tests
        run: make test

      - name: Build with AddressSanitizer (Linux only)
        if: runner.os == 'Linux'
        run: make asan

      - name: Smoke test — binary exists and shows help
        run: |
          test -x ./wmletras && echo "Binary OK: wmletras exists and is executable"
